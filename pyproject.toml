[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-voice-mcp"
version = "0.2.0"
description = "An async MCP server for Microsoft Edge text-to-speech"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anyio>=4.5,<5",
  "edge-tts==7.3.1",
  "mcp==1.30.0",
  "mutagen==1.47.0",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "imageio-ffmpeg==0.6.0"]

[project.scripts]
edge-voice-mcp = "edge_voice_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_voice_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["/.comparison", "/.venv", "/dist", "/.pytest_cache", "/.ruff_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in test sending text to Microsoft"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
