[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "edge-voice-mcp"
version = "0.2.1"
description = "An async MCP server for Microsoft Edge text-to-speech"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "tts", "edge-tts", "speech", "subtitles"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "anyio>=4.5,<5",
  "edge-tts==7.3.1",
  "mcp==1.30.0",
  "mutagen==1.47.0",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9", "pytest-asyncio>=1,<2", "pytest-cov>=6,<9",
  "ruff>=0.14,<1", "mypy>=1.18,<2", "bandit>=1.8,<2", "twine>=7,<8",
  "imageio-ffmpeg==0.6.0",
]

[project.scripts]
edge-voice-mcp = "edge_voice_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_voice_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["/.comparison", "/.venv", "/dist", "/.pytest_cache", "/.ruff_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: opt-in test sending text to Microsoft",
  "docker: opt-in test requiring a locally built Docker image and running Linux engine",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["edge_voice_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
