name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python }}
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv export --locked --no-dev --no-emit-project --no-header --format requirements-txt --output-file requirements-runtime.txt --quiet
      - run: git diff --exit-code -- requirements-runtime.txt
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked bandit -q -r src
      - run: uv run --locked pytest -q --cov=edge_voice_mcp
      - run: uv build
      - run: uv run --locked twine check --strict dist/*

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          version: "0.13.1"
          enable-cache: true
      - run: docker compose -f compose.yaml config --quiet
      - run: docker build --tag edge-voice-mcp:local .
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m docker
        env:
          EDGE_TTS_DOCKER_TESTS: "1"
